[project]
name = "claude-settings-scan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.8.1",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "temporalio>=1.20,<2.0",
]

[project.scripts]
claude-scan = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
